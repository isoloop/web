name: Deploy

# The site to GitHub Pages (isoloop.dev, ADR 0001): the site at / once a
# site-v* tag is reachable (before that a placeholder), basic at
# <pages url>/examples/basic/ (website plan task 4b), and the dashboards at <pages url>/examples/dashboards/markets/ (M3b task 19; the old
# <pages url>/examples/markets/ paths redirect there) and
# <pages url>/examples/dashboards/plant/ (M3d) and the processor at
# <pages url>/examples/processor/ (M3h), then each one's smoke test
# against the live URL. Pages serves one site, so every deploy builds every app. Only
# from a `markets-v*`, `plant-v*`, `basic-v*` or `processor-v*` tag (release.yml) or by hand: the public
# demos change when someone decides they should.
#
# GitHub Pages can't set COOP/COEP headers, so the metrics panel's memory figure
# shows "unavailable" there; everything else works.
#
# The same workflow deploys the preview, next.isoloop.dev (ADR 0007): isoloop/next
# calls it with `preview: true` and a web ref (the `next` branch by default).
# A called workflow deploys to its caller's Pages, so the preview gets this
# build, assembly and smoke tests, against its own URL.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The isoloop/web commit, branch or tag to build (empty: next for a preview, else this run's commit)"
        type: string
        default: ''
      preview:
        description: 'Build the preview site (next.isoloop.dev, ADR 0007)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "The isoloop/web commit, branch or tag to build (empty: next for a preview, else the caller's commit)"
        type: string
        default: ''
      preview:
        description: 'Build the preview site (next.isoloop.dev, ADR 0007)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read by ui/vite and the site's build: banner, noindex, no sitemap.
      ISOLOOP_PREVIEW: ${{ inputs.preview && '1' || '' }}
      # The preview always has the site, whether or not a site-v* tag is
      # reachable from the ref (scripts/assemble-site.sh).
      SITE: ${{ inputs.preview && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Named, so a call from isoloop/next builds this repo, not the caller.
          repository: isoloop/web
          ref: ${{ inputs.ref || (inputs.preview && 'next') || github.sha }}
          # The tags, so assemble-site.sh can tell whether a site-v* tag is
          # reachable and the site goes in.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/dashboards/*" --filter ./apps/basic --filter ./apps/processor --filter ./apps/site build
      - name: Assemble the site
        run: scripts/assemble-site.sh site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # In the job, not the workflow: this one is also called from release.yml.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}examples/
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboards/markets, dashboards/plant, basic, processor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isoloop/web
          ref: ${{ inputs.ref || (inputs.preview && 'next') || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium
      # Against the caller's Pages: isoloop.dev, or next.isoloop.dev for the preview.
      - run: pnpm --filter ./apps/${{ matrix.app }} e2e --project=live
        env:
          LIVE_URL: ${{ needs.deploy.outputs.url }}examples/${{ matrix.app }}/
