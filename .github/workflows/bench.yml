name: Bench smoke

# plant-bench (apps/bench/plant, README.md): CI only checks that it still runs.
# check.yml already builds it with every app; this runs one short round on
# Chromium, every configuration once at 1 kHz, and fails if a page stops.
# Nothing is measured or asserted about the figures: real runs are manual, on
# the bench server, at each minor and major release.
on:
  pull_request:
    paths:
      - apps/bench/**
      - pnpm-lock.yaml
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium
      - run: pnpm --filter ./apps/bench/plant bench:smoke
        env:
          CI: 'true'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plant-bench-smoke
          path: apps/bench/plant/results-smoke
          retention-days: 7
