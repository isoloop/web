name: Check

# Format, lint, types, unit tests and every app's build, including its bundle
# checks (no Isoloop code in native bundles, no React DOM in Preact ones).
# `apps` lists the apps whose E2E a pull request runs: those its changes reach
# (scripts/ci/e2e-apps.ts), all of them otherwise.
on:
  workflow_call:
    outputs:
      apps:
        value: ${{ jobs.check.outputs.apps }}
      site:
        value: ${{ jobs.check.outputs.site }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      site: ${{ steps.site.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The apps whose runtime inputs the pull request changes, and the apps
        # that depend on a changed package (scripts/ci/e2e-apps-rule.ts says
        # which files count). Every app without a base (weekly.yml).
        run: node scripts/ci/e2e-apps.ts
      - id: site
        env:
          # The pull request's base, or the push's previous commit.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The site job (ADR 0002, decision 11) runs when the site, the design
          # system, basic (which the landing page embeds) or any example.json
          # changes; or when there's nothing to compare against.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            site=true
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(apps/site|apps/samples|packages/ui|apps/basic)/|(^|/)example\.json$|^scripts/assemble-site\.sh$|^\.github/workflows/site\.yml$'; then
            site=true
          else
            site=false
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
