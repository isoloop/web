# Throwaway, never merged: plant's Firefox suite five times on isoloop/isoloop#384's
# host (a8f14ea) and five times on the published one, as e2e.yml runs it on a PR.
name: Q32 warm-up proof
on: pull_request
permissions:
  contents: read
jobs:
  plant-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [fixed, published]
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Swap in the fixed host
        if: matrix.host == 'fixed'
        run: |
          host=$(echo node_modules/.pnpm/@isoloop+host@*/node_modules/@isoloop/host)
          test -d "$host"
          mkdir "$RUNNER_TEMP/host"
          tar -xzf .github/q32/host.tgz -C "$RUNNER_TEMP/host"
          rm -rf "$host/dist"
          cp -r "$RUNNER_TEMP/host/package/dist" "$host/dist"
          grep -q steadyFrom "$host/dist/index.js"
      - uses: ./.github/actions/install-browsers
        with:
          browsers: firefox
      - name: Suite, without retries
        run: pnpm --filter ./apps/dashboards/plant e2e --project=firefox --retries=0 --pass-with-no-tests
        env:
          E2E_SCOPE: react
          PERF_BUDGET_SCALE: '2'
          E2E_HEAVY: '0'
      - name: Load project, without retries
        run: pnpm --filter ./apps/dashboards/plant e2e --project=firefox-load --workers=1 --retries=0 --pass-with-no-tests
        env:
          E2E_SCOPE: react
          PERF_BUDGET_SCALE: '2'
          E2E_HEAVY: '0'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q32-${{ matrix.host }}-${{ matrix.run }}
          path: apps/dashboards/plant/playwright-report
          retention-days: 7
